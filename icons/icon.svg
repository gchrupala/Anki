      <stop offset="0" stop-color="#7b3fc4"/>
      <stop offset="0.5" stop-color="#2a4fc2"/>
      <stop offset="1" stop-color="#12806c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="248" y="148" width="170" height="100" rx="10" fill="#4f2386"/>
