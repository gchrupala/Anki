<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MaxApki: the cards of the eight apps in steps, BiologiaMax
       (butterfly) at the back, then AstronomiaMax (Saturn), MapkiMax
       (folded map with a pin),
       JęzykiMax (speech bubbles),
       LiteraturaMax (book), ChemiaMax (flask), StoliceMax (globe) and
       MnożenieMax (×) in front. Each symbol sits on the part of its card the
       next card leaves free. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2306d"/>
      <stop offset="0.14" stop-color="#1d2766"/>
      <stop offset="0.29" stop-color="#0d8a86"/>
      <stop offset="0.43" stop-color="#e8710a"/>
      <stop offset="0.57" stop-color="#c0392b"/>
      <stop offset="0.71" stop-color="#7b3fc4"/>
      <stop offset="0.86" stop-color="#2a4fc2"/>
      <stop offset="1" stop-color="#12806c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Eight cards fill more room than seven: all are made smaller to stay
       in the middle, where a round icon mask leaves them whole. -->
