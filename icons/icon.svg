<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MaxApki: the cards of the six apps in steps, MapkiMax (folded map
       with a pin) at the back, then JęzykiMax (speech bubbles),
       LiteraturaMax (book), ChemiaMax (flask), StoliceMax (globe) and
       MnożenieMax (×) in front. Each symbol sits on the part of its card the
       next card leaves free. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d8a86"/>
      <stop offset="0.2" stop-color="#e8710a"/>
      <stop offset="0.4" stop-color="#c0392b"/>
      <stop offset="0.6" stop-color="#7b3fc4"/>
      <stop offset="0.8" stop-color="#2a4fc2"/>
      <stop offset="1" stop-color="#12806c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Six cards fill more room than five: all are made smaller to stay in
       the middle, where a round icon mask leaves them whole. -->
  <g transform="translate(9.3 47) scale(0.882)">
